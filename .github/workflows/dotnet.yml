name: Build Code-Room

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CodeRoom.Web/CodeRoom.Web.csproj

      - name: Build
        run: dotnet build CodeRoom.Web/CodeRoom.Web.csproj --configuration Release --no-restore
