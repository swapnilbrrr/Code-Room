name: .NET Build and Test

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CodeRoom.sln

      - name: Build
        run: dotnet build CodeRoom.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodeRoom.sln --configuration Release --no-build --verbosity normal
